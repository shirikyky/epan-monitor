name: uptime

# External watchdog for https://everypaintinghasaname.com
#
# Runs from GitHub's cloud, NOT from the site's own server — so it still fires when
# the server itself is down (the on-server watchdogs cannot). While the site is
# healthy this job is silent. When it fails it opens an issue labelled "uptime",
# which GitHub emails to the repository owner; the issue closes itself once the
# site answers again.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force a failure, to test the alert path'
        type: boolean
        default: false

permissions:
  issues: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the site
        id: probe
        run: |
          set -u
          fail=""
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            fail="בדיקת מסלול ההתראה (הרצה ידנית)"
          fi
          code=$(curl -sS -o /tmp/page.html -w '%{http_code}' --max-time 30 -L \
                 https://everypaintinghasaname.com/ 2>/dev/null || echo 000)
          if [ "$code" != "200" ]; then
            fail="האתר לא מגיב (HTTP $code)"
          elif ! grep -q 'assets/app.js' /tmp/page.html; then
            fail="האתר מגיב אבל התוכן אינו שלנו"
          fi
          dns=$(dig +short A everypaintinghasaname.com @1.1.1.1 2>/dev/null | head -1)
          case "$dns" in
            104.*|172.6*|172.7*|188.114.*|162.15*|131.0.*) ;;
            "") fail="${fail:+$fail · }הדומיין לא מתפענח" ;;
            *)  fail="${fail:+$fail · }הדומיין מצביע ל-$dns במקום ל-Cloudflare" ;;
          esac
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "result: [${fail:-OK}]"

      - name: Open or close the alert issue
        uses: actions/github-script@v7
        env:
          FAIL: ${{ steps.probe.outputs.fail }}
        with:
          script: |
            const fail = (process.env.FAIL || '').trim();
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'uptime'
            });
            const stamp = new Date().toISOString().slice(0, 16).replace('T', ' ');
            if (fail && open.data.length === 0) {
              await github.rest.issues.create({
                owner, repo, labels: ['uptime'],
                title: `🔴 האתר לא זמין — ${stamp} UTC`,
                body: [
                  'בדיקה אוטומטית **מהענן של GitHub** (לא מהשרת של האתר).',
                  '',
                  `**${fail}**`,
                  '',
                  `- האתר: https://everypaintinghasaname.com/`,
                  `- זמן הבדיקה: ${new Date().toISOString()}`,
                  '',
                  '_ההתראה נוספה אוטומטית ותיסגר מעצמה כשהאתר יחזור לענות._'
                ].join('\n')
              });
            } else if (!fail && open.data.length > 0) {
              for (const issue of open.data) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `✅ האתר חזר להיות זמין — ${new Date().toISOString()}`
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: 'closed'
                });
              }
            }

      # GitHub disables scheduled workflows in repositories with no activity for
      # 60 days. One tiny commit a month keeps the watchdog armed.
      - name: Monthly keep-alive
        if: github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *'
        run: |
          if [ "$(date -u +%d)" != "01" ]; then exit 0; fi
          git config user.name  "uptime-watchdog"
          git config user.email "uptime-watchdog@users.noreply.github.com"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git add .keepalive
          git commit -m "keep-alive $(date -u +%Y-%m)" || exit 0
          git push origin "${GITHUB_REF_NAME}"
